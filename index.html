<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, follow">
    <title>Redirecting to Travel Radar LK</title>
    <link rel="canonical" href="https://travelradarlk.com/en/">
    <link rel="icon" href="/favicon.ico">
    <meta http-equiv="refresh" content="0; url=/en/">
    <script>
        (function () {
            var target = '/en/' + window.location.search + window.location.hash;
            window.location.replace(target);
        })();
    </script>
    <style>
        body {
            margin: 0;
            padding: 2rem;
            background: #0d0f14;
            color: #e8eaf0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            line-height: 1.6;
        }
        a {
            color: #d4a96a;
        }
    </style>
</head>
<body>
    <main>
        <p>Redirecting to the English homepage: <a href="/en/">https://travelradarlk.com/en/</a></p>
    </main>
</body>
</html>
