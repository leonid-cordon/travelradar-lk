<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Travel Radar LK</title>

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&family=Cormorant+Garamond:wght@300;400&display=swap"
        rel="stylesheet">

    <style>
        :root {
            --deep: #0d1f2d;
            --turq: #3ab8c8;
            --gold: #c9a84c;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            height: 100vh;
            background: var(--deep);
            font-family: 'Inter', sans-serif;
            color: white;
            overflow: hidden;
        }

        /* BACKGROUND LAYERS */
        .bg {
            position: absolute;
            inset: 0;
            overflow: hidden;
        }

        .layer {
            position: absolute;
            width: 140%;
            height: 140%;
            top: -20%;
            left: -20%;
            transition: transform 0.2s ease-out;
        }

        .layer1 {
            background:
                radial-gradient(circle at 70% 30%, rgba(58, 184, 200, 0.15), transparent 60%);
        }

        .layer2 {
            background:
                radial-gradient(circle at 20% 80%, rgba(201, 168, 76, 0.1), transparent 60%);
        }

        .layer3 {
            background:
                linear-gradient(160deg, #0d1f2d 0%, #08151f 100%);
        }

        /* CENTER */
        .wrapper {
            position: relative;
            z-index: 2;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
        }

        /* CONTENT */
        .content {
            animation: fadeIn 1.2s ease forwards;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
                filter: blur(6px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
                filter: blur(0);
            }
        }

        /* TITLE */
        .title {
            font-family: 'Cormorant Garamond', serif;
            font-size: 60px;
            font-weight: 300;
            margin-bottom: 12px;
            letter-spacing: 1px;
        }

        /* SUBTITLE */
        .subtitle {
            opacity: 0.6;
            margin-bottom: 60px;
            font-size: 16px;
        }

        /* LANG LIST */
        .lang-list {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        /* BUTTON */
        .lang {
            position: relative;
            font-size: 16px;
            letter-spacing: 3px;
            padding: 18px 50px;
            cursor: pointer;
            color: rgba(255, 255, 255, 0.7);
            transition: 0.35s;
        }

        /* glow */
        .lang::before {
            content: '';
            position: absolute;
            inset: 0;
            background: radial-gradient(circle, rgba(255, 255, 255, 0.08), transparent 70%);
            opacity: 0;
            transition: 0.4s;
        }

        /* underline */
        .lang::after {
            content: '';
            position: absolute;
            left: 50%;
            bottom: 0;
            width: 0;
            height: 1px;
            background: var(--gold);
            transform: translateX(-50%);
            transition: 0.4s;
        }

        .lang:hover::before {
            opacity: 1;
        }

        .lang:hover {
            color: white;
            transform: translateY(-2px);
        }

        .lang:hover::after {
            width: 70%;
        }

        /* ACTIVE */
        .lang.active {
            color: var(--turq);
        }

        .lang.active::after {
            width: 85%;
            background: var(--turq);
        }

        /* DETECTED */
        .detected {
            margin-top: 30px;
            font-size: 13px;
            opacity: 0.5;
        }
    </style>
</head>

<body>

    <div class="bg">
        <div class="layer layer1" id="l1"></div>
        <div class="layer layer2" id="l2"></div>
        <div class="layer layer3" id="l3"></div>
    </div>

    <div class="wrapper">
        <div class="content">

            <div class="title">Travel Radar LK</div>
            <div class="subtitle" id="subtitle"></div>

            <div class="lang-list">
                <div class="lang" data-lang="en">ENGLISH →</div>
                <div class="lang" data-lang="ru">РУССКИЙ →</div>
                <div class="lang" data-lang="ua">УКРАЇНСЬКА →</div>
            </div>

            <div class="detected" id="detected"></div>

        </div>
    </div>

    <script>
        const lang = (navigator.language || '').toLowerCase();

        let detected = 'en';
        if (lang.startsWith('ru')) detected = 'ru';
        if (lang.startsWith('uk')) detected = 'ua';

        const text = {
            en: {
                subtitle: "Where to stay. What it costs. What matters.",
                detected: "Detected language: English"
            },
            ru: {
                subtitle: "Где остановиться. Сколько это стоит. Что важно.",
                detected: "Определён язык: Русский"
            },
            ua: {
                subtitle: "Де зупинитися. Скільки це коштує. Що важливо.",
                detected: "Визначено мову: Українська"
            }
        };

        document.getElementById('subtitle').innerText = text[detected].subtitle;

        setTimeout(() => {
            document.querySelector(`[data-lang="${detected}"]`)?.classList.add('active');
            document.getElementById('detected').innerText = text[detected].detected;
        }, 800);

        /* click */
        document.querySelectorAll('.lang').forEach(el => {
            el.onclick = () => {
                const l = el.getAttribute('data-lang');
                window.location.href = '/' + l + '/';
            }
        });

        /* PARALLAX */
        document.addEventListener('mousemove', (e) => {
            const x = (e.clientX / window.innerWidth - 0.5);
            const y = (e.clientY / window.innerHeight - 0.5);

            document.getElementById('l1').style.transform =
                `translate(${x * 20}px, ${y * 20}px)`;

            document.getElementById('l2').style.transform =
                `translate(${x * 40}px, ${y * 40}px)`;

            document.getElementById('l3').style.transform =
                `translate(${x * 10}px, ${y * 10}px)`;
        });
    </script>

</body>

</html>
