<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Travel Radar LK</title>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --deep:   #08141e;
            --deep2:  #0d1f2d;
            --turq:   #4ec9d8;
            --turq2:  #2ab5c8;
            --gold:   #c9a84c;
            --gold2:  #e2c06a;
            --gold3:  #a8853a;
            --white:  #ffffff;
            --dim:    rgba(255,255,255,0.55);
            --dim2:   rgba(255,255,255,0.28);
        }

        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

        html, body {
            height: 100%;
            overflow: hidden;
            background: var(--deep);
            font-family: 'Inter', sans-serif;
            color: var(--white);
        }

        /* ── BACKGROUND ── */
        .bg {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 0;
        }

        .layer {
            position: absolute;
            width: 150%;
            height: 150%;
            top: -25%;
            left: -25%;
            will-change: transform;
            transition: transform 0.25s cubic-bezier(.22,.68,0,1.2);
        }

        .layer1 {
            background: radial-gradient(ellipse 60% 50% at 72% 28%, rgba(78,201,216,0.13), transparent 70%);
        }
        .layer2 {
            background: radial-gradient(ellipse 55% 55% at 20% 78%, rgba(201,168,76,0.09), transparent 70%);
        }
        .layer3 {
            background: linear-gradient(160deg, #0d1f2d 0%, #08141e 100%);
            z-index: -1;
        }

        /* subtle noise grain */
        .grain {
            position: fixed;
            inset: 0;
            z-index: 1;
            opacity: .028;
            pointer-events: none;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
            background-size: 200px 200px;
        }

        /* ── WRAPPER ── */
        .wrapper {
            position: relative;
            z-index: 10;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* ── CONTENT ── */
        .content {
            text-align: center;
            animation: fadeUp 1.4s cubic-bezier(.22,.68,0,1) forwards;
        }

        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(28px); filter: blur(8px); }
            to   { opacity: 1; transform: translateY(0);    filter: blur(0); }
        }

        /* ── EYEBROW ── */
        .eyebrow {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 14px;
            margin-bottom: 20px;
            opacity: 0;
            animation: fadeUp 1.4s 0.15s cubic-bezier(.22,.68,0,1) forwards;
        }

        .eyebrow-line {
            width: 36px;
            height: 1px;
            background: linear-gradient(90deg, transparent, var(--gold3));
        }
        .eyebrow-line.right {
            background: linear-gradient(90deg, var(--gold3), transparent);
        }

        .eyebrow-text {
            font-family: 'Inter', sans-serif;
            font-size: 10px;
            font-weight: 400;
            letter-spacing: 4px;
            color: var(--gold3);
            text-transform: uppercase;
        }

        /* ── TITLE ── */
        .title {
            font-family: 'Cormorant Garamond', serif;
            font-size: clamp(52px, 6vw, 76px);
            font-weight: 300;
            line-height: 1;
            letter-spacing: 1px;
            margin-bottom: 10px;
            background: linear-gradient(160deg, var(--gold2) 0%, var(--gold) 50%, var(--gold3) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            filter: drop-shadow(0 0 28px rgba(201,168,76,.22));
            opacity: 0;
            animation: fadeUp 1.4s 0.25s cubic-bezier(.22,.68,0,1) forwards;
        }

        /* ── DIVIDER ── */
        .title-divider {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            margin-bottom: 28px;
            opacity: 0;
            animation: fadeUp 1.4s 0.35s cubic-bezier(.22,.68,0,1) forwards;
        }

        .title-divider span {
            width: 50px;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(201,168,76,.35));
        }
        .title-divider span:last-child {
            background: linear-gradient(90deg, rgba(201,168,76,.35), transparent);
        }

        .diamond {
            width: 4px;
            height: 4px;
            background: var(--gold3);
            transform: rotate(45deg);
            opacity: .7;
        }

        /* ── SUBTITLE ── */
        .subtitle {
            font-size: 13px;
            font-weight: 300;
            letter-spacing: 1px;
            margin-bottom: 64px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-wrap: wrap;
            gap: 0 10px;
            line-height: 1;
            opacity: 0;
            animation: fadeUp 1.4s 0.45s cubic-bezier(.22,.68,0,1) forwards;
        }

        .subtitle-chunk {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            white-space: nowrap;
        }

        .sub-accent { color: var(--turq); }
        .sub-plain  { color: var(--dim); }

        .sep {
            display: inline-block;
            width: 1px;
            height: 10px;
            background: rgba(255,255,255,.18);
            flex-shrink: 0;
        }

        /* ── FLAGS ROW ── */
        .flags-row {
            display: flex;
            align-items: stretch;
            justify-content: center;
            gap: 2px;
            margin-bottom: 40px;
            opacity: 0;
            animation: fadeUp 1.4s 0.58s cubic-bezier(.22,.68,0,1) forwards;
        }

        /* ── LANG BUTTON ── */
        .lang-btn {
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 12px;
            padding: 28px 40px 24px;
            cursor: pointer;
            border: 1px solid transparent;
            border-radius: 2px;
            transition: background .35s, border-color .35s, transform .3s cubic-bezier(.22,.68,0,1.4);
            min-width: 130px;
            user-select: none;
        }

        /* top bar */
        .lang-btn::before {
            content: '';
            position: absolute;
            top: 0; left: 50%;
            transform: translateX(-50%) scaleX(0);
            width: 60%;
            height: 1px;
            background: var(--turq2);
            transition: transform .35s cubic-bezier(.22,.68,0,1);
            transform-origin: center;
        }

        .lang-btn:hover::before,
        .lang-btn.active::before {
            transform: translateX(-50%) scaleX(1);
        }

        .lang-btn:hover {
            background: rgba(78,201,216,.05);
            border-color: rgba(78,201,216,.12);
            transform: translateY(-3px);
        }

        .lang-btn.active {
            background: rgba(78,201,216,.07);
            border-color: rgba(78,201,216,.2);
        }

        /* ── FLAG ── */
        .flag {
            width: 32px;
            height: 24px;
            border-radius: 2px;
            overflow: hidden;
            flex-shrink: 0;
            box-shadow: 0 2px 8px rgba(0,0,0,.4);
        }

        .flag svg {
            width: 100%;
            height: 100%;
            display: block;
        }

        /* ── LANG LABEL ── */
        .lang-label {
            font-size: 10px;
            font-weight: 500;
            letter-spacing: 3px;
            color: var(--dim);
            text-transform: uppercase;
            transition: color .3s;
        }

        .lang-btn:hover .lang-label {
            color: rgba(255,255,255,.85);
        }

        .lang-btn.active .lang-label {
            color: var(--turq);
        }

        /* ── DIVIDER BETWEEN BUTTONS ── */
        .btn-divider {
            width: 1px;
            background: rgba(255,255,255,.07);
            align-self: stretch;
            flex-shrink: 0;
            margin: 10px 0;
        }

        /* ── DETECTED ── */
        .detected-wrap {
            opacity: 0;
            animation: fadeUp 1.4s 0.9s cubic-bezier(.22,.68,0,1) forwards;
        }

        .detected {
            font-size: 11px;
            font-weight: 300;
            letter-spacing: 2px;
            color: var(--dim2);
            text-transform: uppercase;
        }

        /* ── BOTTOM ORNAMENT ── */
        .bottom-line {
            position: fixed;
            bottom: 32px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            align-items: center;
            gap: 16px;
            opacity: 0;
            animation: fadeUp 1.4s 1.1s cubic-bezier(.22,.68,0,1) forwards;
            z-index: 10;
        }

        .bottom-line span {
            width: 40px;
            height: 1px;
            background: rgba(255,255,255,.08);
        }

        .bottom-dot {
            width: 3px;
            height: 3px;
            border-radius: 50%;
            background: rgba(255,255,255,.15);
        }
    </style>
</head>
<body>

    <div class="bg">
        <div class="layer layer3" id="l3"></div>
        <div class="layer layer2" id="l2"></div>
        <div class="layer layer1" id="l1"></div>
    </div>
    <div class="grain"></div>

    <div class="wrapper">
        <div class="content">

            <!-- eyebrow -->
            <div class="eyebrow">
                <div class="eyebrow-line"></div>
                <span class="eyebrow-text">Sri Lanka</span>
                <div class="eyebrow-line right"></div>
            </div>

            <!-- title -->
            <div class="title">Travel Radar LK</div>

            <!-- decorative divider -->
            <div class="title-divider">
                <span></span>
                <div class="diamond"></div>
                <span></span>
            </div>

            <!-- subtitle -->
            <div class="subtitle" id="subtitle-line">
                <span class="subtitle-chunk">
                    <span class="sub-accent">Где</span>
                    <span class="sub-plain">остановиться</span>
                </span>
                <span class="sep"></span>
                <span class="subtitle-chunk">
                    <span class="sub-accent">Сколько</span>
                    <span class="sub-plain">это стоит</span>
                </span>
                <span class="sep"></span>
                <span class="subtitle-chunk">
                    <span class="sub-accent">Что</span>
                    <span class="sub-plain">важно</span>
                </span>
            </div>

            <!-- flags -->
            <div class="flags-row">

                <div class="lang-btn" data-lang="en" id="btn-en">
                    <div class="flag">
                        <!-- UK Flag SVG -->
                        <svg viewBox="0 0 60 40" xmlns="http://www.w3.org/2000/svg">
                            <rect width="60" height="40" fill="#012169"/>
                            <path d="M0,0 L60,40 M60,0 L0,40" stroke="#fff" stroke-width="8"/>
                            <path d="M0,0 L60,40 M60,0 L0,40" stroke="#C8102E" stroke-width="5"/>
                            <path d="M30,0 V40 M0,20 H60" stroke="#fff" stroke-width="12"/>
                            <path d="M30,0 V40 M0,20 H60" stroke="#C8102E" stroke-width="7"/>
                        </svg>
                    </div>
                    <div class="lang-label" id="label-en">English</div>
                </div>

                <div class="btn-divider"></div>

                <div class="lang-btn" data-lang="ru" id="btn-ru">
                    <div class="flag">
                        <!-- Russian Flag SVG -->
                        <svg viewBox="0 0 60 40" xmlns="http://www.w3.org/2000/svg">
                            <rect width="60" height="13.3" fill="#fff"/>
                            <rect y="13.3" width="60" height="13.4" fill="#0039A6"/>
                            <rect y="26.7" width="60" height="13.3" fill="#D52B1E"/>
                        </svg>
                    </div>
                    <div class="lang-label" id="label-ru">Русский</div>
                </div>

                <div class="btn-divider"></div>

                <div class="lang-btn" data-lang="ua" id="btn-ua">
                    <div class="flag">
                        <!-- Ukrainian Flag SVG -->
                        <svg viewBox="0 0 60 40" xmlns="http://www.w3.org/2000/svg">
                            <rect width="60" height="20" fill="#005BBB"/>
                            <rect y="20" width="60" height="20" fill="#FFD500"/>
                        </svg>
                    </div>
                    <div class="lang-label" id="label-ua">Українська</div>
                </div>

            </div>

            <!-- detected -->
            <div class="detected-wrap">
                <div class="detected" id="detected-text"></div>
            </div>

        </div>
    </div>

    <!-- bottom ornament -->
    <div class="bottom-line">
        <span></span>
        <div class="bottom-dot"></div>
        <div class="bottom-dot"></div>
        <div class="bottom-dot"></div>
        <span></span>
    </div>

    <script>
        const locales = {
            en: {
                subtitle: ['Where', 'to stay', 'How much', 'it costs', 'What', 'matters'],
                detected: 'Language detected · English',
                label: 'English'
            },
            ru: {
                subtitle: ['Где', 'остановиться', 'Сколько', 'это стоит', 'Что', 'важно'],
                detected: 'Определён язык · Русский',
                label: 'Русский'
            },
            ua: {
                subtitle: ['Де', 'зупинитися', 'Скільки', 'це коштує', 'Що', 'важливо'],
                detected: 'Визначено мову · Українська',
                label: 'Українська'
            }
        };

        /* detect */
        const nav = (navigator.language || '').toLowerCase();
        let detected = 'en';
        if (nav.startsWith('ru')) detected = 'ru';
        if (nav.startsWith('uk')) detected = 'ua';

        /* render subtitle */
        function renderSubtitle(code) {
            const w = locales[code].subtitle;
            const line = document.getElementById('subtitle-line');
            line.innerHTML = `
                <span class="subtitle-chunk">
                    <span class="sub-accent">${w[0]}</span>
                    <span class="sub-plain">${w[1]}</span>
                </span>
                <span class="sep"></span>
                <span class="subtitle-chunk">
                    <span class="sub-accent">${w[2]}</span>
                    <span class="sub-plain">${w[3]}</span>
                </span>
                <span class="sep"></span>
                <span class="subtitle-chunk">
                    <span class="sub-accent">${w[4]}</span>
                    <span class="sub-plain">${w[5]}</span>
                </span>`;
        }

        renderSubtitle(detected);

        setTimeout(() => {
            document.getElementById('btn-' + detected)?.classList.add('active');
            document.getElementById('detected-text').innerText = locales[detected].detected;
        }, 900);

        /* click */
        document.querySelectorAll('.lang-btn').forEach(el => {
            el.addEventListener('click', () => {
                const code = el.getAttribute('data-lang');
                window.location.href = '/' + code + '/';
            });
        });

        /* parallax */
        document.addEventListener('mousemove', (e) => {
            const x = e.clientX / window.innerWidth  - 0.5;
            const y = e.clientY / window.innerHeight - 0.5;
            document.getElementById('l1').style.transform = `translate(${x*22}px, ${y*22}px)`;
            document.getElementById('l2').style.transform = `translate(${x*44}px, ${y*44}px)`;
            document.getElementById('l3').style.transform = `translate(${x*10}px, ${y*10}px)`;
        });
    </script>

</body>
</html>
