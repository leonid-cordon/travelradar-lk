<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Travel Radar LK</title>

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&family=Cormorant+Garamond:wght@300;400&display=swap"
        rel="stylesheet">

    <style>
        :root {
            --deep: #0d1f2d;
            --turq: #3ab8c8;
            --gold: #c9a84c;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            height: 100vh;
            background: var(--deep);
            font-family: 'Inter', sans-serif;
            color: white;
            overflow: hidden;
        }

        /* BACKGROUND */
        .bg {
            position: absolute;
            inset: 0;
            background:
                radial-gradient(circle at 70% 30%, rgba(58, 184, 200, 0.15), transparent 60%),
                radial-gradient(circle at 20% 80%, rgba(201, 168, 76, 0.08), transparent 60%),
                linear-gradient(160deg, #0d1f2d 0%, #08151f 100%);
        }

        /* CENTER */
        .wrapper {
            position: relative;
            z-index: 2;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            animation: fadeIn 1.2s ease forwards;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
                filter: blur(6px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
                filter: blur(0);
            }
        }

        /* TITLE */
        .title {
            font-family: 'Cormorant Garamond', serif;
            font-size: 54px;
            font-weight: 300;
            margin-bottom: 10px;
            letter-spacing: 0.5px;
        }

        .subtitle {
            opacity: 0.6;
            margin-bottom: 50px;
            font-size: 15px;
            transition: 0.3s;
        }

        /* LANG LIST */
        .lang-list {
            display: flex;
            flex-direction: column;
            gap: 18px;
        }

        /* BUTTON */
        .lang {
            position: relative;
            font-size: 15px;
            letter-spacing: 2px;
            padding: 16px 40px;
            cursor: pointer;
            transition: 0.35s;
            color: rgba(255, 255, 255, 0.7);
        }

        /* underline animation */
        .lang::after {
            content: '';
            position: absolute;
            left: 50%;
            bottom: 0;
            width: 0;
            height: 1px;
            background: var(--gold);
            transition: 0.35s;
            transform: translateX(-50%);
        }

        .lang:hover {
            color: white;
        }

        .lang:hover::after {
            width: 60%;
        }

        /* ACTIVE */
        .lang.active {
            color: var(--turq);
        }

        .lang.active::after {
            width: 80%;
            background: var(--turq);
        }

        /* DETECTED */
        .detected {
            margin-top: 25px;
            font-size: 13px;
            opacity: 0.5;
            transition: 0.3s;
        }
    </style>
</head>

<body>

    <div class="bg"></div>

    <div class="wrapper">
        <div>

            <div class="title">Travel Radar LK</div>
            <div class="subtitle" id="subtitle"></div>

            <div class="lang-list">
                <div class="lang" data-lang="en">ENGLISH →</div>
                <div class="lang" data-lang="ru">РУССКИЙ →</div>
                <div class="lang" data-lang="ua">УКРАЇНСЬКА →</div>
            </div>

            <div class="detected" id="detected"></div>

        </div>
    </div>

    <script>
        const lang = (navigator.language || '').toLowerCase();

        let detected = 'en';
        if (lang.startsWith('ru')) detected = 'ru';
        if (lang.startsWith('uk')) detected = 'ua';

        const text = {
            en: {
                subtitle: "Where to stay. What it costs. What matters.",
                detected: "Detected language: English"
            },
            ru: {
                subtitle: "Где остановиться. Сколько это стоит. Что важно.",
                detected: "Определён язык: Русский"
            },
            ua: {
                subtitle: "Де зупинитися. Скільки це коштує. Що важливо.",
                detected: "Визначено мову: Українська"
            }
        };

        /* apply text */
        document.getElementById('subtitle').innerText = text[detected].subtitle;

        setTimeout(() => {
            const el = document.querySelector(`[data-lang="${detected}"]`);
            if (el) el.classList.add('active');

            document.getElementById('detected').innerText =
                text[detected].detected;
        }, 800);

        /* click */
        document.querySelectorAll('.lang').forEach(el => {
            el.onclick = () => {
                const l = el.getAttribute('data-lang');
                window.location.href = '/' + l + '/';
            }
        });
    </script>

</body>

</html>
